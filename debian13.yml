- name: Run the playbook tasks on the localhost
  hosts: 127.0.0.1
  connection: local

  roles:
    - docker
    - java8-oracle
    - warsaw

  tasks:
    - name: Configura o debian.sources
      ansible.builtin.copy:
        content: |
          Types: deb deb-src
          URIs: http://deb.debian.org/debian/
          Suites: trixie
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb deb-src
          URIs: http://security.debian.org/debian-security/
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb deb-src
          URIs: http://deb.debian.org/debian/
          Suites: trixie-updates
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
        dest: /etc/apt/sources.list.d/debian.sources
        owner: root
        group: root
        mode: '0644'
      when: ansible_os_family == 'Debian'

    - name: Apaga o arquivo /etc/apt/sources.list
      ansible.builtin.file:
        state: absent
        path: /etc/apt/sources.list
      when: ansible_os_family == 'Debian'

    - name: Cria .ssh
      ansible.builtin.file:
        state: directory
        path: /home/humbertos/.ssh
        owner: humbertos
        group: humbertos
        mode: '0755'
      when: ansible_os_family == 'Debian'
      tags: ssh

    - name: Cria ssh_config
      ansible.builtin.copy:
        content: |
          Host 172.18.119.*
            User admin
            StrictHostKeyChecking no
            KexAlgorithms +diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1,diffie-hellman-group1-sha1
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
            Ciphers +aes256-cbc

          Host *
            User root
            StrictHostKeyChecking no
            IdentityFile ~/.ssh/id_ed25519
        dest: /home/humbertos/.ssh/config
        owner: humbertos
        group: humbertos
        mode: '0644'
        backup: true
      when: ansible_os_family == 'Debian'
      tags: ssh

    - name: Cria .gitconfig
      ansible.builtin.copy:
        content: |
          [user]
            name = 85humberto
            email = 85humberto@gmail.com
        dest: /home/humbertos/.gitconfig
        owner: humbertos
        group: humbertos
        mode: '0644'
        backup: true
      when: ansible_os_family == 'Debian'

    - name: Cria .ansible.cfg
      ansible.builtin.copy:
        content: |
          [defaults]
          interpreter_python=auto_silent
          collections_paths=collections
          forks=50
          deprecation_warnings=False
        dest: /home/humbertos/.ansible.cfg
        owner: humbertos
        group: humbertos
        mode: '0644'
        backup: true
      when: ansible_os_family == 'Debian'

    - name: Add the user 'humbertos' to group 'sudo'
      ansible.builtin.user:
        name: humbertos
        groups: sudo
        append: true
      when: ansible_os_family == 'Debian'

    - name: No password prompt for sudo user
      ansible.builtin.copy:
        content: |
          %sudo ALL=(ALL) NOPASSWD: ALL
        dest: /etc/sudoers.d/nopasswd
        owner: root
        group: root
        mode: '0440'
        backup: true
      when: ansible_os_family == 'Debian'

    - name: Script to disable IPv6
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo 1 > /proc/sys/net/ipv6/conf/default/disable_ipv6
          echo 1 > /proc/sys/net/ipv6/conf/all/disable_ipv6
        dest: /usr/local/bin/disable_ipv6
        owner: root
        group: root
        mode: '0755'
      when: ansible_os_family == 'Debian'

    - name: Script to enable IPv6
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo 0 > /proc/sys/net/ipv6/conf/default/disable_ipv6
          echo 0 > /proc/sys/net/ipv6/conf/all/disable_ipv6
        dest: /usr/local/bin/enable_ipv6
        owner: root
        group: root
        mode: '0755'
      when: ansible_os_family == 'Debian'

    - name: Instalar pacotes padroes - Linux
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - pipx
          - unrar
          - ttf-mscorefonts-installer
          - nmap
          - mtr
          - xournal
          - ipcalc
          - bash-completion
          - git
          - dnsutils
          - ldap-utils
          - flatpak
          - make
          - snmp
          - command-not-found
          - tcpdump
          - telnet
          - zsh
          - zsh-autosuggestions
          - zsh-syntax-highlighting
          - nautilus-dropbox
          - curl
      when: ansible_os_family == 'Debian'

    - name: Copia .zshrc
      ansible.builtin.copy:
        src: .zshrc
        dest: /home/humbertos/.zshrc
        owner: humbertos
        group: humbertos
        mode: '0600'
      when: ansible_os_family == 'Debian'

    - name: Add the flathub flatpak repository remote to the user installation
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
      when: (ansible_os_family == 'Debian')

    - name: Install the telegram package from flathub
      community.general.flatpak:
        name: org.telegram.desktop
        state: present
      when: (ansible_os_family == 'Debian')
      tags: flatpak

    - name: Install the anydesk package from flathub
      community.general.flatpak:
        name: com.anydesk.Anydesk
        state: present
      when: (ansible_os_family == 'Debian')
      tags: flatpak

    # TeamViewer
    - name: Adicionar a chave do repositório do TeamViewer
      ansible.builtin.get_url:
        url: https://linux.teamviewer.com/pubkey/currentkey.asc
        dest: /usr/share/keyrings/teamviewer-keyring.gpg
        mode: '0644'
        owner: root
        group: root
      when: ansible_os_family == 'Debian'
      tags: teamviewer

    - name: Adicionar repositório TeamViewer
      ansible.builtin.copy:
        content: "deb [signed-by=/usr/share/keyrings/teamviewer-keyring.gpg] https://linux.teamviewer.com/deb stable main"
        dest: /etc/apt/sources.list.d/teamviewer.list
        owner: root
        group: root
        mode: '0644'
      when: ansible_os_family == 'Debian'
      tags: teamviewer

    - name: Instala TeamViewer
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - teamviewer
      when: ansible_os_family == 'Debian'
      tags: teamviewer

    - name: Install vscode from url
      ansible.builtin.apt:
        deb: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
      when: ansible_os_family == 'Debian'
      tags: vscode
